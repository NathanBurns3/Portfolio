<!-- Option 2: Horizontal Timeline Layout -->
<div id="projects">
  <div class="section-heading">
    <h2>Projects</h2>
  </div>

  <div class="projects-timeline">
    <ng-container *ngFor="let project of projectInfo; let i = index">
      <div
        class="timeline-item"
        [attr.data-index]="i"
        [class.reverse]="i % 2 === 1"
      >
        <div class="timeline-content">
          <div class="project-title-row">
            <h3 class="project-title">{{ project.projectTitle }}</h3>
            <p class="project-summary">{{ project.shortDescription }}</p>
          </div>
          <div class="project-info">
            <div class="project-meta">
              <span>Tech</span>
              <div class="tools-container">
              <span class="tool-tag" *ngFor="let tool of project.toolsUsed">{{
                tool
              }}</span>
              </div>
            </div>
            <ul class="project-details">
              <li *ngFor="let description of project.projectDescription">
                {{ description }}
              </li>
            </ul>
            <div class="project-buttons">
              <a
                *ngIf="project.repoLink"
                [href]="project.repoLink"
                target="_blank"
                class="project-btn github-btn"
              >
                <img
                  src="assets/social-media-icons/github-inverse.png"
                  alt="GitHub"
                  class="btn-icon github-icon"
                />
                View on GitHub
              </a>
              <a
                *ngIf="project.liveLink"
                [href]="project.liveLink"
                target="_blank"
                class="project-btn live-btn"
              >
                <img
                  src="assets/external-link.png"
                  alt="External Link"
                  class="btn-icon external-link-icon"
                />
                View Live Site
              </a>
            </div>
          </div>
          <div class="project-visual">
            <img
              [src]="project.imageSrc"
              [alt]="project.imageAlt"
              class="timeline-image"
            />
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
